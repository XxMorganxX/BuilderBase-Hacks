[project]
name = "agenda-kb"
version = "0.1.0"
description = "A simple queryable knowledge base of company agenda docs, exposed over MCP"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "pymongo>=4.6",
    "PyYAML>=6.0",
]

[project.scripts]
agenda-kb = "agenda_kb.server:main"
agenda-kb-ingest = "agenda_kb.ingest:main"

[project.optional-dependencies]
embeddings = [
    "sentence-transformers>=3.0",
]

[dependency-groups]
dev = [
    "mongomock>=4.1",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agenda_kb"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
