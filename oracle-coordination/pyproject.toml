[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "oracle-coordination"
version = "0.1.0"
description = "Local coordination and arbitration for independent coding sessions"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.11,<3", "PyYAML>=6,<7", "httpx>=0.28,<1", "mcp>=1.26,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.12,<1"]

[project.scripts]
oracle = "oracle.cli:main"
oracle-server = "oracle.cli:server_main"
oracle-bridge = "oracle.cli:bridge_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
