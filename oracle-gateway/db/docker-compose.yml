# Oracle phase 1: database + gateway. Runs on the server machine.
# Usage lives in docs/SERVER-DEPLOYMENT.md.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: oracle
      POSTGRES_USER: oracle
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in db/.env}
    volumes:
      - oracle_pgdata:/var/lib/postgresql/data
      # Applied only when the volume is empty. docs/SERVER-DEPLOYMENT.md also
      # applies schema.sql explicitly, which is idempotent.
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    ports:
      # Published so psql and the seed script can reach it from the host.
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oracle -d oracle"]
      interval: 3s
      timeout: 3s
      retries: 20

  gateway:
    build: ../gateway
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://oracle:${POSTGRES_PASSWORD}@db:5432/oracle
      ORACLE_LOG_LEVEL: ${ORACLE_LOG_LEVEL:-info}
    ports:
      # ORACLE_GATEWAY_PORT is the port laptops connect to. The container
      # always listens on 8080 internally.
      - "${ORACLE_GATEWAY_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  oracle_pgdata: {}
